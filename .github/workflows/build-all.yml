name: Build All Plugins

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build EmoteGrid
        run: dotnet build EmoteGrid/EmoteGrid.csproj -c Release --output ./artifacts/EmoteGrid

      - name: Build NameplateToggle
        run: dotnet build NameplateToggle/NameplateToggle.csproj -c Release --output ./artifacts/NameplateToggle

      - name: Zip Plugins
        run: |
          Compress-Archive -Path ./artifacts/EmoteGrid/* -DestinationPath ./artifacts/EmoteGrid.zip
          Compress-Archive -Path ./artifacts/NameplateToggle/* -DestinationPath ./artifacts/NameplateToggle.zip

      - name: Release Plugins
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/master'
        with:
          name: "Latest Plugin Releases"
          tag_name: latest
          files: |
            ./artifacts/EmoteGrid.zip
            ./artifacts/NameplateToggle.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AllPlugins
          path: ./artifacts/
